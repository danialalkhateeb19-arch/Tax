name: تذكير الضريبة

on:
  schedule:
    # 09:00 بتوقيت موسكو (موسكو = UTC+3 ثابتة بلا توقيت صيفي) — وقت التذكير
    - cron: '0 6 * * *'
    # كل ساعتين — تشغيل صامت لا يرسل شيئاً، وظيفته الوحيدة التقاط ضغطة الزر
    - cron: '0 */2 * * *'
  # زر تشغيل يدوي من تبويب Actions — مفيد للتجربة
  workflow_dispatch:

# مطلوب حتى يستطيع البوت حفظ حالته في المستودع
permissions:
  contents: write

# يمنع تشغيل نسختين في وقت واحد
concurrency:
  group: tax-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تجهيز Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تشغيل البوت
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          START_MONTH: '2026-07'
        run: node .github/scripts/tax-reminder.mjs

      - name: حفظ حالة البوت
        run: |
          if [[ -n "$(git status --porcelain bot-state.json)" ]]; then
            git config user.name  "tax-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bot-state.json
            git commit -m "تحديث حالة تذكير الضريبة [skip ci]"
            git push
          else
            echo "لا تغيير في الحالة."
          fi
